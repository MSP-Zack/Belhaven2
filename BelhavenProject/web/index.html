<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-name" content="Belhaven Project">
    <meta name="theme-color" content="#101827">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Belhaven Project</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./desktop.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 2 2.8 7 12 12l9.2-5L12 2Zm-9.2 10L12 17l9.2-5M2.8 17 12 22l9.2-5" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>Belhaven Project</strong>
          <span class="environment">Private desktop · Codespaces</span>
        </span>
      </div>

      <div class="toolbar">
        <div id="connection-state" class="connection-state" data-state="connecting" role="status" aria-live="polite">
          <span class="state-dot" aria-hidden="true"></span>
          <span id="state-label">Starting your desktop…</span>
        </div>
        <button id="reconnect" class="tool-button" type="button" hidden>Reconnect</button>
        <button id="fullscreen" class="tool-button" type="button" aria-label="Enter full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4" />
          </svg>
          <span>Full screen</span>
        </button>
      </div>
    </header>

    <main class="desktop-stage">
      <section id="desktop" class="desktop" aria-label="Remote desktop" tabindex="0"></section>
      <div id="connection-overlay" class="connection-overlay">
        <div class="loading-mark" aria-hidden="true"></div>
        <p id="connection-message">Starting your desktop…</p>
        <p class="hint">Keep this tab open while your Codespace is running.</p>
        <button id="overlay-reconnect" class="primary-button" type="button" hidden>Try again</button>
      </div>
    </main>

    <footer class="footer">
      <span>Your session and downloads stay in the Codespace.</span>
      <span id="screen-hint">Click the desktop to use it.</span>
    </footer>
  </body>
</html>
